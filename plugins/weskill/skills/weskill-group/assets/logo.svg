    <ellipse cx="170" cy="201" rx="194" ry="205" fill="url(#mint)"/>
    <ellipse cx="397" cy="352" rx="193" ry="198" fill="url(#blue)"/>
    <ellipse cx="245" cy="407" rx="130" ry="20" fill="#2E7584" opacity=".12" filter="url(#soft)"/>
    <g filter="url(#shadow)">
      <path d="M254 169H348C382 169 405 192 405 226V302C405 336 382 359 348 359H334L360 398L299 359H254C220 359 198 336 198 302V226C198 192 220 169 254 169Z" fill="url(#rear)" stroke="white" stroke-opacity=".75" stroke-width="2.5"/>
