      <path d="M115 186C115 154 132 135 164 135H281C309 135 327 146 336 167C281 158 221 194 112 244V186Z" fill="url(#gleam)"/>
      <path d="M121 185C121 153 136 139 166 139H284" stroke="white" stroke-opacity=".88" stroke-width="4" stroke-linecap="round"/>
      <path d="M336 229V270C336 301 317 318 286 318H210L169 350" stroke="#107D75" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
      <path d="M162 332L155 374L208 333" stroke="white" stroke-opacity=".82" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g stroke-linecap="round">
      <path d="M164 217H289M164 253H247" stroke="#087C6B" stroke-opacity=".17" stroke-width="17"/>
      <path d="M164 214H289M164 250H247" stroke="white" stroke-opacity=".95" stroke-width="14"/>
