<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">weSkill</title>
  <desc id="desc">Two overlapping glass conversation bubbles, with mint and blue refractions on a pearl tile.</desc>
  <defs>
    <linearGradient id="tile" x1="70" y1="22" x2="440" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#FCFDFE"/><stop offset=".52" stop-color="#E9F3F3"/><stop offset="1" stop-color="#DCE7F2"/></linearGradient>
    <radialGradient id="mint"><stop stop-color="#55EAC0" stop-opacity=".9"/><stop offset="1" stop-color="#55EAC0" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#73ADF7" stop-opacity=".82"/><stop offset="1" stop-color="#73ADF7" stop-opacity="0"/></radialGradient>
    <linearGradient id="rear" x1="212" y1="136" x2="420" y2="364" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".83"/><stop offset=".42" stop-color="#B8E8FF" stop-opacity=".35"/><stop offset="1" stop-color="#7AAEEB" stop-opacity=".66"/></linearGradient>
    <linearGradient id="glass" x1="123" y1="125" x2="334" y2="354" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".27" stop-color="#DBFFF2" stop-opacity=".58"/><stop offset=".56" stop-color="#67DFBC" stop-opacity=".48"/><stop offset="1" stop-color="#29BDA1" stop-opacity=".8"/></linearGradient>
    <linearGradient id="edge" x1="125" y1="120" x2="337" y2="381" gradientUnits="userSpaceOnUse"><stop stop-color="white"/><stop offset=".42" stop-color="white" stop-opacity=".55"/><stop offset=".72" stop-color="#188F82" stop-opacity=".2"/><stop offset="1" stop-color="white" stop-opacity=".9"/></linearGradient>
    <linearGradient id="gleam" x1="154" y1="145" x2="285" y2="268" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".72"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="190%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/><feOffset in="blur" dy="12" result="offset"/><feFlood flood-color="#1D716A" flood-opacity=".23" result="tint"/><feComposite in="tint" in2="offset" operator="in" result="drop"/><feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect x="20" y="20" width="472" height="472" rx="110"/></clipPath>
    <path id="front" d="M162 122H287C325 122 350 147 350 185V269C350 307 325 332 287 332H211L153 378L159 331C124 330 102 306 102 271V185C102 147 125 122 162 122Z"/>
