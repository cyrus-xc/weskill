name: Test packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-24.04-arm
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -e . build 'setuptools>=77'
      - run: npm test
      - run: python -m unittest discover -s tests -q
      - run: python scripts/check_release.py
      - run: npm run check:package
      - run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - run: python tools/smoke_npm.py dist/weskill-*.tgz
      - if: runner.arch == 'ARM64'
        run: python tools/smoke_npm.py dist/weskill-*.tgz --native
